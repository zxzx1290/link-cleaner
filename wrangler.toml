name = "link-cleaner"
main = "worker/index.js"
compatibility_date = "2026-07-01"

# vite build 的產出；靜態檔案由 Cloudflare 邊緣直接回應，不計入 Worker 請求
[assets]
directory = "./dist"
binding = "ASSETS"
# /api/* 一定要先進 Worker，其餘路徑優先當靜態資產處理
run_worker_first = ["/api/*"]

# /api/expand 的來源 IP 限流。
# namespace_id 是自己取的識別碼（同一個 Worker 內不重複即可），不需要事先建立資源。
# 一分鐘 20 次：正常使用者一次還原一個連結，遠遠用不到；腳本掃站則會馬上撞牆。
[[ratelimits]]
name = "EXPAND_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[observability]
enabled = true
